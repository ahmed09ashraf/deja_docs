<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dejatech Documentation</title>
<meta name="description" content="Dejatech product and business logic documentation">
<script>
  try {
    if (localStorage.getItem('dejatech-docs-theme') === 'light') {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (_) {}
</script>
<link rel="icon" type="image/png" href="logos/dejatech-icon.png">
<link rel="preload" as="image" href="logos/dejatech-logo-white-stacked.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="brand-logo" src="logos/dejatech-logo-white.png" alt="Dejatech">
      </div>
      <div class="brand-text">
        <h1 id="appTitle">Dejatech Docs</h1>
        <p id="appSubtitle">Shipping agency documentation</p>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Modules</div>
      <div id="navList"></div>
    </nav>

    <div class="sidebar-footer">
      <a class="powered-by" href="https://dejatec.com/" target="_blank" rel="noopener noreferrer">
        Powered By <strong>Deja Technology</strong>
      </a>
    </div>
  </aside>

  <div class="main">
    <button type="button" class="theme-toggle" id="themeToggle" title="Switch to light mode" aria-label="Switch to light mode">
      <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"></path>
      </svg>
      <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v.75m6.364 1.886-.53.53M21 12h-.75m-1.886 6.364-.53-.53M12 20.25V21m-6.364-2.636.53-.53M3.75 12H3m2.636-6.364.53.53M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"></path>
      </svg>
      <span class="sr-only">Switch to light mode</span>
    </button>

    <div class="topbar">
      <div class="mobile-brand">
        <img class="brand-logo brand-logo--sm" src="logos/dejatech-logo-white.png" alt="Dejatech">
        <span>Documentation</span>
      </div>
      <button class="burger" id="burgerBtn" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <header class="content-header">
      <div class="breadcrumb">
        <span id="breadcrumbTab">Business Logic Docs</span>
        <span>/</span>
        <span class="accent" id="breadcrumbActive">—</span>
      </div>
      <div class="title-row">
        <div class="title-block">
          <div class="title-icon" id="titleIcon"></div>
          <div>
            <h2 id="moduleTitle">Loading…</h2>
            <p id="moduleSummary"></p>
          </div>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Filter sections in this module…">
          <span class="search-shortcut">/</span>
        </div>
      </div>
    </header>

    <main class="content-body" id="contentBody">
      <div class="empty-state">Loading documentation…</div>
    </main>
  </div>

</div>

<script src="file.js"></script>

</body>
</html>
